# The demo's live-town history: the last seven days of the lighthouse's handover book.
# `lamptown demo` turns these into the event log the Watcher would have written
# (<status_dir>/events/YYYY-MM-DD.jsonl), dated from now, so the book always has a week in it.
#
# Each event is "<when> <kind> [count | ok | red]":
#   when   "-40m": that long before now (today's events, so they lead up to the live agents);
#          "-3d@09:12": three local days ago at 09:12
#   kind   start, files, commit, push, ci, wait, answer, fail, quiet, done, project
#   count  for files and commit; ci takes "ok" (green) or "red"
# Every name here is made up.
status_dir = "agents"

# ---- today: the agents walking the town right now (see agents/*.json)
[[agent]]
id = "lark"
title = "Lark: tide clock"
project = "tidebook"
tool = "kitebot"
plot = "tower"
events = ["-8h start", "-7h10m files 2", "-6h30m fail", "-1h quiet"]

