# Local guardrails. Set up once per clone:
#   pip install pre-commit && pre-commit install
# That installs the pre-commit, commit-msg and pre-push hooks below.
# Maintainers: point LAMPTOWN_DENYLIST at the private deny-list (kept outside the repo).
# Without it the deny-list check is skipped and every other check still runs.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: local
    hooks:
      - id: lamptown-privacy-gate
        name: privacy gate (staged files)
        entry: python tools/privacy_gate.py
        language: python
        stages: [pre-commit]
      - id: lamptown-privacy-gate-commit-msg
        name: privacy gate (commit message and identity)
        entry: python tools/privacy_gate.py --commit-msg
        language: python
        stages: [commit-msg]
      - id: lamptown-privacy-gate-pre-push
        name: privacy gate (everything being pushed)
        entry: python tools/privacy_gate.py --pre-push
        language: python
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
